<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2d2b2b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- folded map (sticker w/ thick cream border) -->
  <g filter="url(#soft)" transform="rotate(-6 125 140)">
    <path d="M45 90 L95 74 L155 90 L205 74 L205 190 L155 206 L95 190 L45 206 Z" fill="#fdfaf3" stroke="#fdfaf3" stroke-width="14" stroke-linejoin="round"/>
    <path d="M45 90 L95 74 L95 190 L45 206 Z" fill="#a9c6a0"/>
    <path d="M95 74 L155 90 L155 206 L95 190 Z" fill="#f6e3b8"/>
    <path d="M155 90 L205 74 L205 190 L155 206 Z" fill="#9fc4c9"/>
    <!-- map details -->
    <path d="M58 150 Q80 128 95 140 T140 132 T192 118" fill="none" stroke="#e8a05c" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 10"/>
    <path d="M108 170 q14 -10 34 -4" fill="none" stroke="#7ba3a8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="170,150 179,166 161,166" fill="#e9f0e5" stroke="#8aa884" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- compass -->
  <g filter="url(#soft)" transform="rotate(10 62 78)">
    <circle cx="62" cy="78" r="34" fill="#fdfaf3"/>
    <circle cx="62" cy="78" r="26" fill="#f3ead8" stroke="#d9c9a8" stroke-width="3"/>
    <polygon points="62,58 68,78 62,98 56,78" fill="#e2574c"/>
    <polygon points="62,58 68,78 56,78" fill="#f07f70"/>
    <circle cx="62" cy="78" r="5" fill="#fdfaf3" stroke="#c9b891" stroke-width="2"/>
    <text x="62" y="50" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#8a7c5c" font-weight="bold">N</text>
  </g>

  <!-- location pin -->
  <g filter="url(#soft)">
    <path d="M158 66 C 138 66 124 81 124 100 C 124 126 158 158 158 158 C 158 158 192 126 192 100 C 192 81 178 66 158 66 Z"
          fill="#e2574c" stroke="#fdfaf3" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="158" cy="100" r="15" fill="#f8c94e" stroke="#fdfaf3" stroke-width="4"/>
  </g>
</svg>
